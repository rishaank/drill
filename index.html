<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --surface:#15171c; --surface2:#1c1f26; --line:#272a33; --line2:#3a3e4a;
  --text:#eceef3; --muted:#8b90a0; --accent:#5eead4; --accent-ink:#04201b;
  --amber:#fbbf24; --red:#fb7185; --green:#4ade80; --r:16px;
  --mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.5 Geist,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(700px 420px at 85% -10%,rgba(94,234,212,.09),transparent 70%),radial-gradient(600px 420px at -10% 110%,rgba(251,191,36,.05),transparent 70%)}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 96px;position:relative}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(94,234,212,.12)}
select{width:auto;padding:8px 12px;background:var(--surface2);cursor:pointer}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.18);margin-left:6px}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .1s,filter .15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#222630}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface2)}
.btn:disabled{opacity:.5;cursor:default}
.btn kbd{margin:0}
.icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon:hover{background:var(--surface2);color:var(--text)}
.icon svg{width:17px;height:17px}

h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.035em;font-weight:700;line-height:1.1}
h2{font-size:24px;letter-spacing:-.02em;font-weight:600}
.sub{color:var(--muted)}

/* sets */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;transition:border-color .2s,transform .2s;display:flex;flex-direction:column;gap:16px;min-height:170px}
.set:hover{border-color:var(--line2);transform:translateY(-2px)}
.set h3{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.set .meta{font-size:13px;color:var(--muted);margin-top:4px}
.set .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.set .acts{display:flex;gap:2px;margin-right:-8px}
.pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.set.new{border-style:dashed;background:none;align-items:center;justify-content:center;color:var(--muted);gap:8px;font-weight:500}
.set.new:hover{color:var(--text)}
.set.new b{font-size:26px;font-weight:400;line-height:1}

.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar span{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .m{background:var(--accent)}
.bar .f{background:var(--amber)}

/* editor */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
label.f{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
textarea{font-family:var(--mono);font-size:13.5px;line-height:1.6;resize:vertical;min-height:240px}
textarea[readonly]{opacity:.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.opts-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.opts-row label{display:flex;gap:8px;align-items:center}
.preview{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;scroll-behavior:smooth}
.preview .kind{font-style:normal;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border:1px solid rgba(94,234,212,.3);border-radius:99px;padding:2px 8px;align-self:start;white-space:nowrap;animation:pop .4s}
.preview div{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);animation:in .3s}
.preview div:last-child{border:0}
.preview b{font-weight:600}
.preview span{color:var(--muted)}
.count{font-family:var(--mono);font-size:12px;color:var(--accent)}

/* AI generation panel */
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.gen{border:1px solid rgba(94,234,212,.3);background:var(--bg);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:in .3s}
.gen-top{display:flex;align-items:center;gap:10px}
.gen-top b{flex:1;font-weight:500;font-size:14px}
.gen.done{border-color:var(--line)}
.gen.done .spin{animation:none;border-color:var(--accent);background:var(--accent)}
.gen.err{border-color:rgba(251,113,133,.4)}
.gen.err .spin{animation:none;border-color:var(--red);background:var(--red)}
.segs{display:flex;gap:4px}
.segs span{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;transition:box-shadow .3s}
.segs span.active{box-shadow:0 0 0 1px rgba(94,234,212,.45)}
.segs i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.gen-stats{display:flex;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.gen-stats b{color:var(--text);font-weight:500}
.live{font-family:var(--mono);font-size:12.5px;color:var(--accent);min-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live::after{content:"▍";animation:blink 1s steps(1) infinite}
.gen.done .live,.gen.err .live{display:none}

/* learn */
.learn-top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.learn-top .title{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{margin-bottom:28px}
.legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--surface2);border:1px solid var(--line2)}
.legend .lm i{background:var(--accent);border:0}.legend .lf i{background:var(--amber);border:0}
.q{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;animation:in .35s cubic-bezier(.2,.8,.2,1);transition:border-color .25s,box-shadow .25s}
.q.ok{border-color:rgba(74,222,128,.5);box-shadow:0 0 0 4px rgba(74,222,128,.06)}
.q.mid{border-color:rgba(251,191,36,.5);box-shadow:0 0 0 4px rgba(251,191,36,.06)}
.q.bad{border-color:rgba(251,113,133,.5);box-shadow:0 0 0 4px rgba(251,113,133,.06)}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.02)}}
.shake{animation:shake .35s}
.q-label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:16px;font-weight:500;flex-wrap:wrap}
.qn{margin-left:auto;font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line2)}
.pips i.on{background:var(--accent)}
.tag{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.tag.w{color:var(--amber);border-color:rgba(251,191,36,.3)}
.tag.a{color:var(--accent);border-color:rgba(94,234,212,.3)}
.tag.r{color:var(--red);border-color:rgba(251,113,133,.3)}
.q-text{font-size:clamp(20px,3.2vw,26px);font-weight:500;letter-spacing:-.015em;line-height:1.35;min-height:60px;white-space:pre-wrap;word-break:break-word}
.hint-line{font-size:13px;color:var(--muted);margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.opts.one{grid-template-columns:1fr;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);transition:border-color .15s,transform .15s,opacity .2s,background .2s;font-size:15px;line-height:1.4;word-break:break-word}
.opt:hover:not(:disabled){border-color:var(--line2);transform:translateY(-1px)}
.opt kbd{margin:1px 0 0;width:22px;height:22px;padding:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);flex:none;transition:.15s}
.opt:disabled{cursor:default}
.opt.chk{padding:13px 16px}
.opt.chk.on{border-color:var(--accent);background:rgba(94,234,212,.06)}
.opt.chk.on kbd{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--green);background:rgba(74,222,128,.08);animation:pop .3s}
.opt.right kbd{background:var(--green);color:#052e12}
.opt.missed{border-color:var(--green);border-style:dashed}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.08);animation:shake .35s}
.opt.dim{opacity:.4}
.write{display:flex;gap:10px;margin-top:28px}
.write input{font-size:17px;padding:14px 16px}
.dunno{margin-left:-10px}
.write~.dunno{margin-top:10px}
.cloze{margin-top:24px;font-size:19px;line-height:2.3;padding:18px 20px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.blank{display:inline-block;width:auto;padding:0 8px;margin:0 2px;border-radius:8px;font-size:inherit;line-height:1.6;border:0;border-bottom:2px solid var(--accent);background:var(--surface2);text-align:center;box-shadow:none}
.blank:focus{box-shadow:0 0 0 3px rgba(94,234,212,.15)}
.blank.right{border-color:var(--green);color:var(--green)}
.blank.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
textarea.explain{font-family:inherit;font-size:16px;line-height:1.55;min-height:130px;margin-top:24px}
.fb:empty,.ai:empty{display:none}
.fb,.ai{margin-top:22px;animation:in .3s cubic-bezier(.2,.8,.2,1)}
.msg.ok{color:var(--green);font-weight:600;font-size:17px}
.msg.ok span{color:var(--muted);font-weight:400;font-size:14px}
.msg p{color:var(--muted);font-size:14px;font-weight:400;margin-top:6px}
.verdict{font-weight:600;font-size:17px;margin-bottom:12px}
.msg.bad .verdict{color:var(--red)}.msg.mid .verdict{color:var(--amber)}
.lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-top:12px}
.lbl:first-child{margin-top:0}
.yours{white-space:pre-wrap;max-height:120px;overflow:auto}
.msg.bad .yours{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.ans{color:var(--green);font-size:17px;font-weight:600;white-space:pre-wrap}
.msg .row{margin-top:20px;justify-content:flex-end}
.hook{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(94,234,212,.06);border:1px solid rgba(94,234,212,.2);color:var(--text)!important;font-size:14.5px}
.hook::before{content:"✨ Memory hook";display:block;font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.compare p{white-space:pre-wrap;margin-top:6px}
.self{margin-top:16px;justify-content:flex-end}
.ai-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .3s}
.ai-box.ok{border-color:rgba(74,222,128,.4)}.ai-box.mid{border-color:rgba(251,191,36,.4)}.ai-box.bad{border-color:rgba(251,113,133,.4)}
.ai-head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.ai-time{margin-left:auto;font-family:var(--mono);font-size:12px}
.score{display:flex;align-items:center;gap:12px}
.score .meter{flex:1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.score .meter span{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ai-box.ok .meter span{background:var(--green)}.ai-box.mid .meter span{background:var(--amber)}.ai-box.bad .meter span{background:var(--red)}
.score b{font-family:var(--mono);font-size:20px;min-width:44px;text-align:right}
.ai-row{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:14.5px}
.ai-row .lbl{margin:2px 0 0}
.ai-err{color:var(--amber);font-size:14px}
.why-ai{margin-top:14px;font-size:14.5px;line-height:1.55;color:var(--text)!important}
.why-ai::before{content:"✨ Why";display:block;font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.why-ai.loading{color:var(--muted)!important}
.whynot{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.whynot li{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:12px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.whynot li.picked{border-color:rgba(251,113,133,.4)}
.whynot span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:600px){.whynot li{grid-template-columns:1fr;gap:2px}}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:4px 0 20px}
.res{list-style:none;display:flex;flex-direction:column;gap:2px;margin-bottom:24px}
.res li{display:grid;grid-template-columns:22px 1fr 2fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.res li:last-child{border:0}
.res li span{font-weight:700}.res .ok span{color:var(--green)}.res .mid span{color:var(--amber)}.res .no span{color:var(--red)}
.res em{font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.done-card{text-align:center;padding:56px 32px}
.done-card .check{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 20px;font-size:30px;font-weight:700;animation:pop .5s}
.done-card .row{justify-content:center;margin-top:28px}

/* dialog */
dialog{margin:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:28px;width:min(480px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog[open]{animation:in .25s cubic-bezier(.2,.8,.2,1)}
dialog form{display:flex;flex-direction:column;gap:18px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:500}
.switch small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.switch input{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;padding:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{left:20px;background:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6}
.hint code{font-family:var(--mono);font-size:12px;color:var(--text)}
.model{display:flex;flex-direction:column;gap:6px;font-weight:500}
.model input{accent-color:var(--accent);width:100%;margin:6px 0 0;cursor:pointer}
.model .ticks{position:relative;height:18px;font-size:12px;font-weight:400;color:var(--muted)}
/* each label sits over its stop; the thumb travels 8px in from each end */
.model .ticks span{position:absolute;cursor:pointer;transform:translateX(-50%)}
.model .ticks span:nth-child(1){left:0;transform:none}
.model .ticks span:nth-child(2){left:calc(8px + (100% - 16px) / 3)}
.model .ticks span:nth-child(3){left:calc(8px + (100% - 16px) * 2 / 3)}
.model .ticks span:nth-child(4){right:0;transform:none}
.model .ticks span.on{color:var(--accent);font-weight:600}
.model small{color:var(--muted);font-weight:400;font-size:13px;line-height:1.5;min-height:3em}
#aiStatus{font-size:13px}
dialog a{color:var(--accent);text-decoration:none}dialog a:hover{text-decoration:underline}
.tag.free{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.tag.local{color:var(--accent);border-color:rgba(94,234,212,.35);background:rgba(94,234,212,.08)}
.tag.paid{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.tag.plan{color:var(--text);border-color:var(--line2);background:var(--surface2)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}

@media(max-width:600px){
  .opts{grid-template-columns:1fr}
  .q{padding:22px}
  .write{flex-direction:column}
  .compare{grid-template-columns:1fr}
  .res li{grid-template-columns:22px 1fr}.res em{display:none}
  header{margin-bottom:32px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>D</i>Drill</div>
    <div class="row">
    <button class="btn primary" id="newSet">+ New set</button>
    <button class="icon" id="openSettings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    </div>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="sets" id="sets"></div>
  </section>

  <!-- EDIT -->

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };
const load = (k, d) => { try { return JSON.parse(localStorage[k]) ?? d } catch { return d } };
const save = () => { localStorage['drill.sets'] = JSON.stringify(sets); localStorage['drill.cfg'] = JSON.stringify(cfg) };
const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` };
const ROUND = 7, GOAL = 3;
// Settings → AI model. Auto spends Haiku on the frequent study-time calls and Sonnet on the rare set-building calls,
// where a "false" statement that's secretly true would teach a wrong fact.
const MODELS = ['auto', 'haiku', 'sonnet', 'opus'];
const MODEL_NAME = { haiku: 'Claude Haiku 5.5', sonnet: 'Claude Sonnet 5.5', opus: 'Claude Opus 5.5' };
const MODEL_HINT = {
  auto: 'Haiku 5.5 grades, explains and writes hooks while you study; Sonnet 5.5 builds and optimizes sets, where accuracy matters most. Best for long sessions.',
  haiku: 'Haiku 5.5 for everything. Lightest on your plan\'s usage limits; sets it builds may need a closer check.',
  sonnet: 'Sonnet 5.5 for everything. Sharper grading and explanations, but every study answer uses more of your plan.',
  opus: 'Opus 5.5 for everything. The most capable and the heaviest on usage; rarely needed for flashcards.',
};
const PRAISE = ['Nice!', 'Nailed it.', 'Correct!', 'You got it.', 'Perfect.', 'Locked in.'];
const ICON = {
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  del: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>'
};
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

// Settings → AI provider. tier: uses the Auto/Haiku/Sonnet/Opus slider; noKey: runs without a key; optKey: key optional;
// base: OpenAI-compatible server (Drill.swift sends everything that isn't Claude to its /chat/completions); pick: model to choose when the default is missing.
const PROVIDERS = {
  claude: { name: 'Claude Code', tag: 'Your Claude plan', cls: 'plan', tier: true, noKey: true, hint: 'Uses the Claude Code app you already have: no key, and it counts toward your Claude plan\'s usage limits. <a href="https://claude.com/claude-code">Install Claude Code</a> and log in once.' },
  gemini: { name: 'Google Gemini', tag: 'Free Online', cls: 'free', key: 'https://aistudio.google.com/apikey', base: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-flash-latest', hint: 'Free with a Google account: make a key in Google AI Studio. The free tier has daily limits, and Google may use free-tier prompts to improve its products.' },
  groq: { name: 'Groq', tag: 'Free Online', cls: 'free', key: 'https://console.groq.com/keys', base: 'https://api.groq.com/openai/v1', model: 'openai/gpt-oss-120b', hint: 'Free key, very fast open models. Free accounts are rate-limited.' },

  ollama: { name: 'Ollama', tag: 'Free Local', cls: 'local', noKey: true, base: 'http://localhost:11434/v1', hint: 'Runs AI on this Mac: free, private, works offline. <a href="https://ollama.com/download">Install Ollama</a>, then download a model by running <code>ollama pull gemma3</code> in Terminal. Needs 8 GB+ of memory; bigger models grade better.' },
  lmstudio: { name: 'LM Studio', tag: 'Free Local', cls: 'local', noKey: true, base: 'http://localhost:1234/v1', hint: 'Runs AI on this Mac with a point-and-click app. <a href="https://lmstudio.ai">Install LM Studio</a>, download a model, then start its local server (Developer tab).' },
  anthropic: { name: 'Anthropic API', tag: 'Paid · API key', cls: 'paid', tier: true, key: 'https://console.anthropic.com/settings/keys', hint: 'Claude, billed per use to an Anthropic API account.' },
  openai: { name: 'OpenAI', tag: 'Paid · API key', cls: 'paid', key: 'https://platform.openai.com/api-keys', base: 'https://api.openai.com/v1', model: 'gpt-5-mini', hint: 'OpenAI\'s models, billed per use to an OpenAI API account (separate from a ChatGPT subscription).' },
  custom: { name: 'Other (OpenAI-compatible)', tag: 'Any provider', cls: 'plan', optKey: true, base: '', hint: 'Any service with an OpenAI-compatible API (Mistral, DeepSeek, xAI, Together, a server on your network…). Paste its base URL, a key if it needs one, and a model name.' },
};
const firstRun = !localStorage['drill.cfg'];
let cfg = load('drill.cfg', { ai: false, model: 'auto', answerWith: 'term', provider: 'claude' });
let sets = load('drill.sets', null) || [{
  id: 1, name: 'Sample — Cell Organelles', cards: [
    ['Mitochondria', 'Organelle that produces ATP through cellular respiration'],
    ['Ribosome', 'Site of protein synthesis'],
    ['Nucleus', 'Contains the cell\'s DNA and controls cell activities'],
    ['Golgi apparatus', 'Modifies, sorts, and packages proteins for transport'],
    ['Chloroplast', 'Site of photosynthesis in plant cells'],
    ['Lysosome', 'Contains digestive enzymes that break down waste'],
    ['Cell membrane', 'Phospholipid bilayer that controls what enters and leaves the cell'],
    ['Rough ER', 'Membrane network studded with ribosomes; makes proteins for export'],
  ].map(([t, d]) => ({ t, d, lv: 0, miss: 0 }))
}];
if (!MODELS.includes(cfg.model)) cfg.model = 'auto'; // also replaces old Ollama model names
if (!PROVIDERS[cfg.provider]) cfg.provider = 'claude';
cfg.models ??= {}; cfg.bases ??= {};
save();

/* ---------- views ---------- */
let genAbort = null, aiAbort = null;
function show(id) {
  clearTimeout(timer); onEnter = keyPick = null;
  aiAbort?.abort(); genAbort?.abort();
  ['home', 'edit', 'learn'].forEach(v => $('#' + v).hidden = v !== id);
  scrollTo(0, 0);
}
const stats = s => ({ n: s.cards.length, m: s.cards.filter(c => c.lv >= GOAL).length, f: s.cards.filter(c => c.lv > 0 && c.lv < GOAL).length });
const barHTML = s => { const { n, m, f } = stats(s); return `<div class="bar"><span class="m" style="width:${m / n * 100}%"></span><span class="f" style="width:${f / n * 100}%"></span></div>` };

function renderHome() {
  $('#sets').innerHTML = sets.map(s => {
    const { n, m } = stats(s);
    return `<div class="set" data-id="${s.id}">
      <div><h3>${esc(s.name)}</h3><div class="meta">${n} terms${s.cards.every(c => c.ai) ? ' · <span style="color:var(--accent)">✨ AI-optimized</span>' : ''}</div></div>
      ${barHTML(s)}
      <div class="foot"><span class="pct">${Math.round(m / n * 100)}% mastered</span>
        <div class="acts">
          <button class="icon" data-act="opt" title="Optimize for studying (AI)">${svg(ICON.spark)}</button>
          <button class="icon" data-act="edit" title="Edit">${svg(ICON.edit)}</button>
          <button class="icon" data-act="reset" title="Reset progress">${svg(ICON.reset)}</button>
          <button class="icon" data-act="del" title="Delete">${svg(ICON.del)}</button>
        </div></div></div>`;
  }).join('') + `<button class="set new" id="newSet2"><b>+</b>New set</button>`;
  $('#newSet2').onclick = () => openEdit();
  show('home');
}
$('#sets').onclick = e => {
  const card = e.target.closest('.set[data-id]'); if (!card) return;
  const s = sets.find(x => x.id == card.dataset.id), act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'edit') return openEdit(s);
  if (act === 'opt') { openEdit(s); return optimize() }
  if (act === 'reset') { if (confirm(`Reset progress for "${s.name}"?`)) { s.cards.forEach(c => { c.lv = 0; c.miss = 0 }); save(); renderHome() } return }
  if (act === 'del') { if (confirm(`Delete "${s.name}"? This can't be undone.`)) { sets = sets.filter(x => x !== s); save(); renderHome() } return }
  startLearn(s);
};
document.querySelectorAll('[data-home]').forEach(b => b.onclick = renderHome);
$('#newSet').onclick = () => openEdit();

/* ---------- editor ---------- */
let editing = null;
const SEPS = { tab: '\t', dash: ' - ', colon: ':', comma: ',' };
// A Drill set file ({"drill":1,"name","cards":[{t,d,ai}]}) imports with its optimization already done.
function parseJSONSet(text) {
  if (!/^\s*\{/.test(text)) return null;
  try { const j = JSON.parse(text); return Array.isArray(j.cards) ? j : null } catch { return null }
}
function parse(text) {
  const j = parseJSONSet(text);
  if (j) return j.cards.filter(c => c && c.t && c.d).map(c => ({ t: String(c.t).trim(), d: String(c.d).trim() }));
  const lines = text.split($('#cardSep').value === 'semi' ? ';' : '\n').map(l => l.trim()).filter(Boolean);
  const sep = SEPS[$('#sep').value] || ['\t', ' - ', ' — ', ':', ','].find(s => lines.filter(l => l.includes(s)).length >= lines.length * .6) || '\t';
  const unq = s => s.trim().replace(/^"([\s\S]*)"$/, '$1').trim();
  return lines.map(l => { const i = l.indexOf(sep); return i < 0 ? null : { t: unq(l.slice(0, i)), d: unq(l.slice(i + sep.length)) } })
    .filter(c => c && c.t && c.d);
}
function renderPreview(cards) {
  $('#count').textContent = cards.length + (cards.length === 1 ? ' card' : ' cards');
  $('#preview').hidden = !cards.length;
  $('#preview').innerHTML = cards.slice(0, 300).map(c => { const ai = aiOf(c); return `<div><b>${esc(c.t)}</b><span>${esc(c.d)}</span>${ai ? `<em class="kind" title="AI-chosen question style">✨ ${ai.kind}</em>` : '<i></i>'}</div>` }).join('');
}
function updatePreview() {
  const j = parseJSONSet($('#raw').value);
  if (j) {
    for (const c of parse($('#raw').value)) { const raw = j.cards.find(x => String(x.t).trim() === c.t)?.ai; if (raw) pendingAI.set(keyOf(c), cleanAI(raw, c)) }
    if (!$('#setName').value && j.name) $('#setName').value = String(j.name);
  }
  renderPreview(parse($('#raw').value));
}
function openEdit(s) {
  editing = s || null; pendingAI = new Map();
  $('#editTitle').textContent = s ? 'Edit set' : 'New set';
  $('#setName').value = s ? s.name : '';
  $('#sep').value = 'auto'; $('#cardSep').value = 'nl';
  $('#raw').value = s ? s.cards.map(c => c.t + '\t' + c.d).join('\n') : '';
  $('#genPanel').hidden = true;
  updatePreview(); show('edit'); $(s ? '#raw' : '#setName').focus();
}
['#raw', '#sep', '#cardSep'].forEach(id => $(id).oninput = updatePreview);
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#raw').value = await f.text();
  if (!$('#setName').value) $('#setName').value = f.name.replace(/\.\w+$/, '');
  e.target.value = ''; updatePreview();
};
$('#save').onclick = () => {
  const cards = parse($('#raw').value);
  if (!cards.length) return alert('No cards found. Put one card per line: term, separator, definition.');
  const old = new Map((editing?.cards || []).map(c => [c.t + '\0' + c.d, c]));
  const merged = cards.map(c => { const o = old.get(keyOf(c)), ai = pendingAI.get(keyOf(c)) || o?.ai, hook = o?.hook || ai?.hook; return { ...c, lv: o?.lv || 0, miss: o?.miss || 0, ...(hook && { hook }), ...(ai && { ai }) } });
  const name = $('#setName').value.trim() || 'Untitled set';
  if (editing) Object.assign(editing, { name, cards: merged });
  else sets.unshift({ id: Date.now(), name, cards: merged });
  save(); renderHome();
};

/* ---------- AI (the provider picked in Settings, via Drill.swift), streamed as NDJSON ---------- */
// task: 'build' = notes → cards and Optimize (rare, accuracy-critical); 'study' = grading, hooks, explanations (frequent).
const prov = () => PROVIDERS[cfg.provider];
const baseFor = () => cfg.bases[cfg.provider] ?? prov().base ?? '';
const modelFor = task => !prov().tier ? cfg.models[cfg.provider] || prov().model || ''
  : cfg.model === 'auto' ? (task === 'build' ? 'sonnet' : 'haiku') : cfg.model;
const aiName = (task = 'study') => prov().tier ? MODEL_NAME[modelFor(task)] : modelFor(task) || prov().name;
const errText = t => { try { return JSON.parse(t).error } catch { return t } };
const aiErr = e => e.name === 'AbortError' ? 'Stopped.' : !/fetch|network|load failed/i.test(e.message) ? e.message
  : "Can't reach the AI: open Drill with the Drill app (see Settings).";
async function aiStream(prompt, { signal, onToken, format, task = 'study' } = {}) {
  // ponytail: plain-text body skips the CORS preflight
  const r = await fetch('/ai/generate', { method: 'POST', signal, body: JSON.stringify({ prompt, format, model: modelFor(task), provider: cfg.provider, base: baseFor() }) });
  if (!r.ok) throw new Error(errText(await r.text()) || 'HTTP ' + r.status);
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', n = 0;
  for (;;) {
    const { value, done } = await rd.read(); if (done) break;
    const lines = (buf += dec.decode(value, { stream: true })).split('\n'); buf = lines.pop();
    for (const l of lines) {
      if (!l.trim()) continue;
      const j = JSON.parse(l); if (j.error) throw new Error(j.error);
      text += j.response || ''; n++; onToken?.(text, n);
    }
  }
  return { text, n };
}

/* ---------- notes → cards ---------- */
// ~6000-char parts: each part is a bounded request, so progress is real and nothing runs away
// (Claude handles big parts well and each call has ~2s overhead).
function chunkNotes(text, max = 6000, split = /\n+|(?<=[.!?])\s+/) {
  const parts = []; let buf = '';
  for (const piece of text.split(split)) {
    if (buf && buf.length + piece.length > max) { parts.push(buf); buf = '' }
    buf += (buf ? '\n' : '') + piece;
  }
  if (buf.trim()) parts.push(buf);
  return parts;
}
function parseCardLine(line) {
  const p = line.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').replace(/\*\*/g, '').split(/\s*::\s*/);
  return p.length >= 2 && p[0].trim() && p[1].trim() ? { t: p[0].trim(), d: p.slice(1).join(' ').trim() } : null;
}
const GEN_PROMPT = notes => `Make flashcards from these study notes.
Format: one card per line, exactly like this:
TERM :: DEFINITION
Rules:
- TERM is a short key word, name, date, quote, or concept (under 10 words).
- DEFINITION is one concise sentence using only facts from the notes.
- One card per key fact. No numbering, no headings, no blank lines, no other text.

NOTES:
"""
${notes}
"""

CARDS:
`;
// Shared progress panel for long AI jobs: one bar segment per request, live line, stats, Stop.
function panel(nSegs) {
  const P = $('#genPanel'), t0 = performance.now();
  P.hidden = false; P.className = 'gen';
  $('#genUndo').hidden = true; $('#genStop').textContent = 'Stop'; $('#genCards').textContent = 0;
  ['#genLive', '#genSpeed', '#genPart', '#genKinds'].forEach(id => $(id).textContent = '');
  $('#genSegs').innerHTML = '<span><i></i></span>'.repeat(nSegs);
  const tick = setInterval(() => $('#genTime').textContent = fmtTime(performance.now() - t0), 250);
  const busy = b => $('#fix').disabled = $('#gen').disabled = $('#opt').disabled = $('#save').disabled = $('#raw').readOnly = b;
  busy(true); genAbort = new AbortController();
  let wTok = 0, wMs = 0;
  return {
    signal: genAbort.signal, t0, segs: [...$('#genSegs').children],
    stage: s => $('#genStage').textContent = s,
    speed(n, tFirst, commit) { // tokens/sec across every request in this job
      if (!tFirst) return;
      const ms = wMs + performance.now() - tFirst;
      if (ms > 500) $('#genSpeed').textContent = Math.round((wTok + n) / ms * 1000) + ' tok/s';
      if (commit) { wTok += n; wMs = ms }
    },
    end(err, msg) { clearInterval(tick); genAbort = null; busy(false); P.classList.add(err ? 'err' : 'done'); $('#genStage').textContent = msg; $('#genStop').textContent = 'Close'; $('#genLive').textContent = '' },
  };
}
async function ensureAI(ui) {
  const p = prov();
  ui.stage(`Connecting to ${p.name}…`);
  const s = await fetch('/ai/status?provider=' + cfg.provider, { signal: ui.signal }).then(r => r.ok ? r.json() : {});
  if (!('cli' in s)) throw new Error("Can't reach the AI: open Drill with the Drill app (see Settings).");
  if (cfg.provider === 'claude' && !s.cli) throw new Error('Claude Code is not installed — get it at claude.com/claude-code and log in once, or pick another AI provider in Settings.');
  if (!p.noKey && !p.optKey && !s.key) throw new Error(`Add your ${p.name} API key in Settings first.`);
}
// Fix mode must keep the user's wording: a definition whose words mostly aren't in the source was invented.
const grounded = (d, srcLow) => { const w = d.toLowerCase().match(/[\p{L}\p{N}]{4,}/gu) || []; return !w.length || w.filter(x => srcLow.includes(x)).length / w.length >= .5 };
// fix = keep the user's cards and wording, only restructure; otherwise extract new cards from notes.
const FIX_PROMPT = text => `Reformat this messy text into flashcards. It may be a copied web page, table, list, or quiz.
Rules:
- Keep the original wording. Do not add, invent, summarize, or drop information.

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'), x = c.getContext('2d'); c.className = 'confetti';
  c.width = innerWidth; c.height = innerHeight; document.body.append(c);
  const cols = ['#5eead4', '#fbbf24', '#fb7185', '#a78bfa', '#eceef3'];
  const ps = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, s: Math.random() * 6 + 5, c: cols[Math.random() * 5 | 0], r: Math.random() * 6 }));
  let t = 0;
  (function f() {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .12; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore() }
    ++t < 220 ? requestAnimationFrame(f) : c.remove();
  })();
}

$('#apiKey').onchange = async e => {
  const key = e.target.value.trim(); if (!key) return;
  const r = await fetch('/ai/key', { method: 'POST', body: JSON.stringify({ provider: cfg.provider, key }) }).then(r => r.json()).catch(e => ({ error: aiErr(e) }));
  if (r.error) { $('#aiStatus').textContent = r.error; $('#aiStatus').style.color = 'var(--red)'; return }
  syncAI();
};
$('#base').onchange = e => { cfg.bases[cfg.provider] = e.target.value.trim(); save(); loadModels() };
$('#modelId').onchange = e => { cfg.models[cfg.provider] = e.target.value.trim(); save() };
// Export all sets (with progress and AI optimization) to one file; Import takes that file or a single Drill set file.
$('#exportAll').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ drill: 1, sets })], { type: 'application/json' }));
  a.download = `Drill sets ${new Date().toISOString().slice(0, 10)}.json`; a.click();
};
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  let j; try { j = JSON.parse(await f.text()) } catch { j = null }
  const add = (Array.isArray(j?.sets) ? j.sets : [j]).filter(s => Array.isArray(s?.cards)).map((s, i) => ({ // a trust boundary: rebuild every field
    id: Date.now() + i, name: String(s.name || 'Imported set').slice(0, 200),
    cards: s.cards.filter(c => c?.t && c?.d).map(c => {
      const t = String(c.t), d = String(c.d), ai = c.ai && typeof c.ai === 'object' && cleanAI(c.ai, { t, d });
      return { t, d, lv: Math.min(GOAL, Math.max(0, c.lv | 0)), miss: Math.max(0, c.miss | 0), ...(c.hook && { hook: String(c.hook).slice(0, 500) }), ...(ai && { ai }) };
    }),
  })).filter(s => s.cards.length);
  if (!add.length) return alert("That file isn't a Drill export or set file.");
  sets.unshift(...add); save(); $('#settings').close(); renderHome();
  alert(`Imported ${add.length} set${add.length > 1 ? 's' : ''}.`);
};
$('#testAi').onclick = async () => {
  const st = $('#aiStatus'); st.textContent = 'Connecting…'; st.style.color = '';
  const t0 = performance.now();
  try {
    await aiStream('Reply with exactly: ok');
    st.textContent = `Connected · ${aiName()} replied in ${((performance.now() - t0) / 1000).toFixed(1)}s`; st.style.color = 'var(--green)';
  } catch (e) { st.textContent = aiErr(e); st.style.color = 'var(--red)' }
};

if (location.hash === '#test') {
  const A = console.assert;
  A(check('mitochondria', 'Mitochondria') === 2, 'exact');
  A(check('mitocondria', 'Mitochondria') === 1, 'typo');
  A(check('ribosome', 'Mitochondria') === 0, 'wrong');
  A(check('the nucleus', 'Nucleus') === 2, 'article');
  A(check('ATP', 'ATP; adenosine triphosphate') === 2, 'alternate');
  A(check('atp', 'ADP') === 0, 'short answers must be exact');
  A(check('unsex me here', '1.5 · “Unsex me here”') === 2 && check('1066', '1066') === 2, 'section label optional');
  A(parseCardLine('1. **ATP** :: Energy currency of the cell').t === 'ATP', 'card line');
  A(parseCardLine('Here are your cards:') === null, 'chatter ignored');
  A(frags('Shows his guilt; foreshadows the ending. Uses dramatic irony').length === 3, 'frags');
  A(chunkNotes('Cells are small. '.repeat(800)).every(p => p.length <= 6020), 'chunks bounded');
  const was = { ...cfg, models: { ...cfg.models } };
  cfg.provider = 'claude';
  cfg.model = 'auto'; A(modelFor('build') === 'sonnet' && modelFor('study') === 'haiku', 'auto routes by task');
  cfg.model = 'opus'; A(modelFor('build') === 'opus' && modelFor('study') === 'opus', 'fixed model for every task');
  cfg.provider = 'gemini'; cfg.models = {}; A(modelFor('build') === 'gemini-flash-latest' && baseFor().includes('googleapis'), 'preset model + base');
  cfg.models.gemini = 'gemini-x'; A(modelFor() === 'gemini-x' && aiName() === 'gemini-x', 'chosen model wins');
  Object.assign(cfg, was);
  A(makeCloze('Organelle that produces ATP through cellular respiration').picks.length === 1, 'cloze');
  A(isLong('Site of protein synthesis') === false && isLong('Membrane network studded with ribosomes; makes proteins for export'), 'isLong');
  A(grounded('Reversal of grammatical structures', 'chiasmus: reversal of grammatical structures') && !grounded('A term used in the text, but no definition is given', 'star anaphora repetition'), 'fix keeps only grounded cards');
  const mv = view({ t: '1. (Tier 1) 1.7 · Vaulting ambition', d: 'Macbeth admits his only motive is ambition. [Ambition · Guilt]' });
  A(mv.t === '1.7 · Vaulting ambition' && mv.d === 'Macbeth admits his only motive is ambition.' && mv.tags.join() === 'Ambition,Guilt', 'view cleans labels and splits tags');
  A(view({ t: '3.14', d: 'pi' }).t === '3.14' && view({ t: '1066', d: 'x' }).t === '1066', 'view keeps numeric terms');
  const sc = [{ t: 'A', d: 'cells make proteins in ribosomes' }, { t: 'B', d: 'planets orbit stars' }, { t: 'C', d: 'ribosomes build proteins' }];
  A(similar(sc[0], sc)[0] === sc[2], 'similar ranks shared words first');
  A(guessKind({ t: 'Pythagorean theorem', d: 'a² + b² = c²' }, 'vocab') === 'formula' && guessKind({ t: 'Battle of Hastings', d: '1066' }, 'vocab') === 'fact', 'kind rules');
  A(guessKind({ t: 'Green light', d: 'Symbolizes longing; represents the dream; ties to Daisy' }, 'quote') === 'list' && guessKind({ t: 'X', d: 'short meaning' }, 'nonsense') === 'vocab', 'kind fallback');
  A(makeCloze('Energy equals mass times c squared', 'mass').picks[0].core === 'mass', 'cloze uses AI key');
  const js = '{"drill":1,"name":"T","cards":[{"t":"Mitochondria","d":"Makes ATP","ai":{"kind":"vocab","tru":["Mitochondria make ATP"],"fal":["Mitochondria make DNA"],"wrong":["Ribosome","Mitochondria"],"notes":{"Ribosome":"Builds proteins"},"hook":"Mighty Kondria"}}]}';
  A(parse(js).length === 1 && parseJSONSet(js).name === 'T' && parseJSONSet('Mitochondria\tMakes ATP') === null, 'Drill JSON import');
  const ca = cleanAI(parseJSONSet(js).cards[0].ai, { t: 'Mitochondria', d: 'Makes ATP' });
  A(ca.kind === 'vocab' && ca.wrong.join() === 'Ribosome' && ca.notes.Ribosome === 'Builds proteins' && ca.hook === 'Mighty Kondria' && cleanAI({ kind: 'evil' }, { t: 'X', d: 'y' }).kind === 'vocab', 'cleanAI sanitizes');
  console.log('Drill self-check done');
}
renderHome();
// First launch: ask about AI once, defaulting to Claude Code if it's installed, else the free Gemini tier.
if (firstRun) fetch('/ai/status?provider=claude').then(r => r.json()).then(s => { if (!s.cli) { cfg.provider = 'gemini'; save() } })
  .catch(() => {}).finally(() => openSettings(true));
</script>
</body>
</html>
